<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кодолесье</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Golos+Text:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="goal paper"><small id="chap">Глава 1</small><span id="goal"></span>
    <button class="snd" id="snd" aria-label="Выключить звук">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
        <path class="mute" d="m16 9 6 6m0-6-6 6"/>
      </svg>
    </button></div>
  <div class="stage"><canvas id="cv" width="960" height="720" aria-label="Мир Кодолесья"></canvas></div>
  <div class="pad" id="pad">
    <button class="u" data-d="0,-1" aria-label="Вверх">▲</button>
    <button class="l" data-d="-1,0" aria-label="Влево">◀</button>
    <button class="r" data-d="1,0" aria-label="Вправо">▶</button>
    <button class="d" data-d="0,1" aria-label="Вниз">▼</button>
  </div>
  <p class="help">Ходите стрелками или кнопками. Чтобы поговорить, подойдите к жителю вплотную.</p>
</div>

<div class="title" id="title" hidden>
  <div class="title-card">
    <p class="kicker">Приключение о вайбкодинге</p>
    <h1>Кодолесье</h1>
    <p>Повелитель Багов украл Духа Кода. Верните его, научившись просить точно.</p>
    <button id="t-play">Играть</button>
    <button class="ghost" id="t-notes" hidden>Шпаргалка</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div id="sheet-body"></div></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/quests.js"></script>
<script src="js/platform.js"></script>
<script src="js/game.js"></script>
</body>
</html>
