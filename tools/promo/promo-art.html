<canvas id="c"></canvas>
<script src="file:///home/claude/zaklinatel-promtov/js/world.js"></script>
<script>
const [mode, lang = 'ru'] = location.hash.slice(1).split('-'), TXT = { ru: ['Кодолесье', 'Приключение, где учатся просить ИИ точно'], en: ['Codewood', 'An adventure where you learn to ask AI clearly'], uz: ["Kod o'rmoni", "Sun'iy intellektdan aniq so'rashni o'rgatadi"] }[lang], c = document.getElementById('c'), ctx = c.getContext('2d');
const W = World;
async function go() {
  await document.fonts.load('900 80px Nunito', TXT[0]); await document.fonts.load('700 30px "Golos Text"', TXT[1]);
  const t = 4200;
  if (mode === 'icon') {
    c.width = c.height = 512;
    const g = ctx.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#6c5cff'); g.addColorStop(1, '#22c4a8');

    for (let i = 0; i < 18; i++) { const x = (i * 97) % 512, y = (i * 173) % 512; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(x, y, 2 + i % 3, 0, 7); ctx.fill(); }
    const p = document.createElement('canvas'); p.width = p.height = 420; W.drawPortrait(p.getContext('2d'), 'hero', 420, t);
    ctx.drawImage(p, 60, 70);
    const s = document.createElement('canvas'); s.width = s.height = 200; W.drawPortrait(s.getContext('2d'), 'S', 200, t);

    ctx.drawImage(sc, 60, 230, 800, 470, 0, 0, 800, 470);
    const g = ctx.createLinearGradient(0, 0, 0, 470); g.addColorStop(0, 'rgba(20,16,60,.75)'); g.addColorStop(.45, 'rgba(20,16,60,.1)'); g.addColorStop(1, 'rgba(20,16,60,0)');
